[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antennasim"
version = "0.1.0"
description = "Parametric antenna design with NEC2 simulation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
antennasim = "antennasim.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
